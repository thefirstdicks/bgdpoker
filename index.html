<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BGD POKER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;600;900&display=swap');

        :root { 
            --gold-gradient: linear-gradient(145deg, #f9e498 0%, #d4af37 45%, #a67c00 100%);
            --dark-surface: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            --neon-gold: rgba(212, 175, 55, 0.4);
            --die-red: #ff4d4d;
            --radius-main: 16px;
            --transition-smooth: 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        body { 
            background: #050505; color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh;
            display: flex; justify-content: center;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            z-index: -1;
        }

        /* 우측 상단 족보 버튼 */
        .rank-btn {
            position: fixed; top: 20px; right: 20px;
            padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            background: rgba(0,0,0,0.5); color: #d4af37;
            font-size: 10px; font-weight: 900; letter-spacing: 2px;
            cursor: pointer; z-index: 100; backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .rank-btn:active { transform: scale(0.9); background: #d4af37; color: #000; }

        /* 족보 팝업 레이어 */
        .rank-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 1000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .rank-content {
            width: 85%; max-width: 400px; 
            background: var(--dark-surface); border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: var(--radius-main); padding: 30px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .rank-title {
            font-family: 'Cinzel Decorative', cursive; color: #d4af37;
            text-align: center; font-size: 20px; margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 15px;
        }
        .rank-list { list-style: none; padding: 0; margin: 0; }
        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .rank-name { font-size: 13px; font-weight: 600; color: #eee; }
        .rank-desc { font-size: 9px; color: #888; margin-left: 8px; font-weight: 300; }
        .rank-prob { font-size: 11px; font-weight: 900; color: #d4af37; opacity: 0.8; }
        
        .close-rank {
            margin-top: 25px; width: 100%; height: 45px;
            background: transparent; border: 1px solid #444; color: #888;
            border-radius: 8px; font-weight: 900; cursor: pointer;
        }

        .table-layout { 
            width: 100%; max-width: 600px; height: 100vh;
            display: flex; flex-direction: column; padding: 40px 20px; box-sizing: border-box;
        }

        .pot-area { text-align: center; margin-bottom: 40px; }
        .pot-label { 
            font-size: 10px; letter-spacing: 6px; color: #666; font-weight: 900;
            text-transform: uppercase; margin-bottom: 10px;
        }
        .pot-value { 
            font-family: 'Montserrat', sans-serif; font-size: 90px; font-weight: 900; 
            letter-spacing: -2px; color: #fff; line-height: 1;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .players-area { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            flex: 1; margin-bottom: 50px;
        }
        .player-node {
            width: 30%; transition: all var(--transition-smooth);
            display: flex; flex-direction: column; align-items: center; opacity: 0.3;
            cursor: default;
        }
        
        .player-node.active { opacity: 1; transform: translateY(-15px); }
        
        .player-node.selectable { 
            opacity: 0.8; cursor: pointer; 
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }

        .avatar-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--dark-surface);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center;
            font-size: 35px; margin-bottom: 15px; position: relative;
        }
        .player-node.active .avatar-circle {
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px var(--neon-gold);
        }
        .turn-indicator {
            position: absolute; bottom: -5px; width: 10px; height: 10px;
            background: #d4af37; border-radius: 50%; display: none;
            box-shadow: 0 0 15px #d4af37;
        }
        .player-node.active .turn-indicator { display: block; }

        .player-money { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .player-name { font-size: 9px; color: #555; font-weight: 600; letter-spacing: 2px; }

        .status-tag { font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-top: 5px; display: none; }
        .player-node.all-in .status-tag { display: block; background: #d4af37; color: #000; }

        .controls-area { position: relative; width: 100%; height: 260px; }
        .button-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        button {
            height: 80px; border-radius: var(--radius-main); border: 1px solid rgba(255,255,255,0.08);
            background: #0f0f0f; color: rgba(255,255,255,0.8);
            font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 900;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        
        button:active { transform: scale(0.96); background: #151515; }
        button:disabled { opacity: 0; pointer-events: none; }

        .btn-check { color: #fff; }
        .btn-call { color: #fff; }
        .btn-half { background: var(--gold-gradient); color: #000; border: none; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
        .btn-quarter { border-color: rgba(212, 175, 55, 0.5); color: #d4af37; }
        .btn-die { 
            grid-column: span 2; height: 60px; 
            color: var(--die-red); border-color: rgba(255, 77, 77, 0.2); 
            background: linear-gradient(to bottom, rgba(255, 77, 77, 0.05), transparent);
        }

        button span { display: block; font-size: 10px; font-weight: 400; margin-top: 4px; opacity: 0.5; }
        .btn-half span { color: #000; opacity: 0.7; font-weight: 600; }

        .btn-next {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; color: #000; font-size: 24px; font-weight: 900;
            border-radius: var(--radius-main); display: none; align-items: center; justify-content: center;
            letter-spacing: 4px; text-transform: uppercase; z-index: 10;
            animation: slideUp 0.4s ease-out; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(3px, 2px) rotate(-1deg); }
            60% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<!-- 족보 버튼 및 레이어 추가 -->
<div class="rank-btn" onclick="toggleRank(true)">RANK</div>

<div class="rank-overlay" id="rank-layer" onclick="toggleRank(false)">
    <div class="rank-content" onclick="event.stopPropagation()">
        <div class="rank-title">HAND RANKINGS</div>
        <div class="rank-list">
            <div class="rank-item"><span class="rank-name">7-STRAIGHT</span><span class="rank-prob">0.44%</span></div>
            <div class="rank-item"><span class="rank-name">3 PAIR</span><span class="rank-prob">0.51%</span></div>
            <div class="rank-item">
                <span class="rank-name">DEATH CHAIN<span class="rank-desc">Gap 2, 6 Cards</span></span>
                <span class="rank-prob">1.33%</span>
            </div>
            <div class="rank-item"><span class="rank-name">6-STRAIGHT</span><span class="rank-prob">1.77%</span></div>
            <div class="rank-item"><span class="rank-name">5-STRAIGHT</span><span class="rank-prob">6.21%</span></div>
            <div class="rank-item"><span class="rank-name">2 PAIR</span><span class="rank-prob">16.02%</span></div>
            <div class="rank-item"><span class="rank-name">4-STRAIGHT</span><span class="rank-prob">20.71%</span></div>
            <div class="rank-item"><span class="rank-name">1 PAIR</span><span class="rank-prob">45.77%</span></div>
            <div class="rank-item"><span class="rank-name">3-STRAIGHT</span><span class="rank-prob">65%+</span></div>
            <div class="rank-item"><span class="rank-name">HIGH TILE</span><span class="rank-prob">-</span></div>
        </div>
        <button class="close-rank" onclick="toggleRank(false)">CLOSE</button>
    </div>
</div>

<div class="table-layout">
    <div class="pot-area">
        <div class="pot-label">THE POT</div>
        <div class="pot-value" id="pot-display">0</div>
    </div>

    <div class="players-area">
        <div id="p0-node" class="player-node" onclick="handleWinnerSelection(0)">
            <div class="avatar-circle">🎩<div class="turn-indicator"></div></div>
            <div class="player-money">🪙<span id="p0-chips">100</span></div>
            <div class="player-name">PLAYER I</div>
            <div class="status-tag">ALL-IN</div>
        </div>
        <div id="p1-node" class="player-node" onclick="handleWinnerSelection(1)">
            <div class="avatar-circle">🍷<div class="turn-indicator"></div></div>
            <div class="player-money">🪙<span id="p1-chips">100</span></div>
            <div class="player-name">PLAYER II</div>
            <div class="status-tag">ALL-IN</div>
        </div>
        <div id="p2-node" class="player-node" onclick="handleWinnerSelection(2)">
            <div class="avatar-circle">🥀<div class="turn-indicator"></div></div>
            <div class="player-money">🪙<span id="p2-chips">100</span></div>
            <div class="player-name">PLAYER III</div>
            <div class="status-tag">ALL-IN</div>
        </div>
    </div>

    <div class="controls-area">
        <div class="button-grid" id="button-group">
            <button class="btn-check" id="btn-check" onclick="handleBet('check')">CHECK</button>
            <button class="btn-call" id="btn-call" onclick="handleBet('call')">CALL<span id="call-amt">0</span></button>
            <button class="btn-quarter" id="btn-quarter" onclick="handleBet('quarter')">QUARTER<span id="quarter-amt">0</span></button>
            <button class="btn-half" id="btn-half" onclick="handleBet('half')">HALF<span id="half-amt">0</span></button>
            <button class="btn-die" id="btn-die" onclick="handleBet('die')">DIE</button>
        </div>
        <div class="btn-next" id="btn-next">CONTINUE</div>
    </div>
</div>

<script>
    let START_CHIPS = 100;
    let ANTE_AMOUNT = 5;

    let players = [
        {chips: START_CHIPS, bet: 0, totalBet: 0, folded: false, allIn: false}, 
        {chips: START_CHIPS, bet: 0, totalBet: 0, folded: false, allIn: false}, 
        {chips: START_CHIPS, bet: 0, totalBet: 0, folded: false, allIn: false}
    ];
    let phase, pot, turn, callVal, actCount, isWinnerSelectionMode = false;
    let firstPlayer = -1; 

    const UI = {
        pot: document.getElementById('pot-display'),
        group: document.getElementById('button-group'),
        next: document.getElementById('btn-next'),
        callAmt: document.getElementById('call-amt'),
        qtrAmt: document.getElementById('quarter-amt'),
        halfAmt: document.getElementById('half-amt'),
        rankLayer: document.getElementById('rank-layer')
    };

    // 족보 토글 함수
    function toggleRank(show) {
        UI.rankLayer.style.display = show ? 'flex' : 'none';
    }

    function animateValue(id, start, end, duration) {
        const obj = (typeof id === 'string') ? document.getElementById(id) : id;
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }

    function updateUI(prevPot, isTurnEnd = false) {
        animateValue(UI.pot, prevPot, pot, 1000);
        if (isWinnerSelectionMode) return;

        let p = players[turn];
        let diff = callVal - p.bet;
        
        UI.callAmt.innerText = diff > p.chips ? `ALL-IN (${p.chips})` : `-${diff}`;
        UI.qtrAmt.innerText = `+${Math.floor(pot / 4)}`;
        UI.halfAmt.innerText = `+${Math.floor(pot / 2)}`;

        players.forEach((p, i) => {
            const node = document.getElementById(`p${i}-node`);
            document.getElementById(`p${i}-chips`).innerText = p.chips;
            
            if (isTurnEnd) {
                node.classList.remove('active');
                node.style.opacity = p.folded ? "0.05" : "0.3";
            } else {
                node.classList.toggle('active', i === turn);
                node.classList.toggle('all-in', p.allIn);
                node.style.opacity = p.folded ? "0.05" : (i === turn ? "1" : "0.3");
            }
        });

        if (!isTurnEnd) {
            const needCall = callVal > p.bet;
            document.getElementById('btn-check').disabled = (phase === 2 && actCount === 0) || needCall || p.allIn;
            document.getElementById('btn-call').disabled = !needCall || p.allIn;
            document.getElementById('btn-quarter').disabled = p.allIn;
            document.getElementById('btn-half').disabled = p.allIn;
            document.getElementById('btn-die').disabled = p.allIn;
        } else {
            UI.group.querySelectorAll('button').forEach(btn => btn.disabled = true);
        }
    }

    function handleBet(type) {
        let p = players[turn];
        let prevPot = pot;
        let actualBet = 0;

        if (type === 'half' || type === 'quarter') {
            const shakeDuration = (type === 'half') ? 0.27 : 0.15;
            document.body.style.animation = `shake ${shakeDuration}s ease-in-out`;
            setTimeout(() => document.body.style.animation = "", shakeDuration * 1000);
            
            if (navigator.vibrate) {
                navigator.vibrate((type === 'half') ? [60] : [15]);
            }
            
            let diff = callVal - p.bet;
            actualBet = Math.min(p.chips, diff + Math.floor(pot / (type === 'half' ? 2 : 4)));
        } else if (type === 'call') {
            actualBet = Math.min(p.chips, callVal - p.bet);
        } else if (type === 'die') {
            p.folded = true;
        }

        if (actualBet > 0) {
            p.chips -= actualBet;
            p.bet += actualBet;
            p.totalBet += actualBet;
            pot += actualBet;
            if (p.chips === 0) p.allIn = true;
            if (p.bet > callVal) callVal = p.bet;
        }
        
        actCount++;
        const survivors = players.filter(pl => !pl.folded);
        const canAct = survivors.filter(pl => !pl.allIn);

        if (survivors.length === 1) { 
            isWinnerSelectionMode = true;
            updateUI(prevPot, true);
            startWinnerSelection(players.indexOf(survivors[0])); 
            return; 
        }

        let isTurnEnd = false;
        if ((survivors.every(pl => pl.bet === callVal || pl.allIn) && actCount >= survivors.length) || canAct.length <= 1) {
            isTurnEnd = true;
            UI.group.style.opacity = '0';
            setTimeout(() => {
                UI.group.style.display = 'none';
                if (phase >= 5 || survivors.every(pl => pl.allIn) || canAct.length <= 1) {
                    UI.next.innerText = "SHOWDOWN";
                    UI.next.onclick = () => startWinnerSelection(); 
                } else {
                    UI.next.innerText = "CONTINUE";
                    UI.next.onclick = () => nextPhase();
                }
                UI.next.style.display = 'flex';
            }, 500);
        } else {
            do { turn = (turn + 1) % 3; } while (players[turn].folded || players[turn].allIn);
        }
        updateUI(prevPot, isTurnEnd);
    }

    function startWinnerSelection(autoWinnerIdx = null) {
        isWinnerSelectionMode = true;
        UI.next.style.display = 'none';
        UI.group.style.display = 'none';
        
        setTimeout(() => {
            players.forEach((p, i) => {
                const node = document.getElementById(`p${i}-node`);
                node.classList.remove('active');
                if (!p.folded) {
                    node.style.opacity = "0.3"; 
                    node.classList.add('selectable');
                } else {
                    node.style.opacity = "0.05";
                    node.classList.remove('selectable');
                }
            });
            if (autoWinnerIdx !== null) setTimeout(() => handleWinnerSelection(autoWinnerIdx, true), 300);
        }, 50);
    }

    function handleWinnerSelection(idx, force = false) {
        if ((!isWinnerSelectionMode && !force) || (players[idx].folded && !force)) return;

        let prevPot = pot;
        players[idx].chips += pot;
        pot = 0;
        isWinnerSelectionMode = false;

        players.forEach((_, i) => {
            const node = document.getElementById(`p${i}-node`);
            node.classList.remove('selectable', 'active');
            if (i === idx) {
                node.style.opacity = "1";
                node.classList.add('active'); 
            } else {
                node.style.opacity = "0.05";
            }
        });

        animateValue(UI.pot, prevPot, 0, 800);
        
        setTimeout(() => {
            document.getElementById(`p${idx}-chips`).innerText = players[idx].chips;
            UI.next.innerText = "NEW GAME";
            UI.next.onclick = () => resetGame();
            UI.next.style.display = 'flex';
        }, 850);
    }

    function resetGame() {
        phase = 2; pot = 0; callVal = 0; actCount = 0;
        isWinnerSelectionMode = false;
        firstPlayer = (firstPlayer + 1) % 3;
        
        let startIdx = firstPlayer;
        while (players[startIdx].chips < ANTE_AMOUNT && players.some(pl => pl.chips >= ANTE_AMOUNT)) {
            startIdx = (startIdx + 1) % 3;
        }
        turn = startIdx;

        players.forEach((p, i) => {
            p.bet = 0; p.totalBet = 0; p.folded = false;
            p.allIn = (p.chips <= 0);
            const node = document.getElementById(`p${i}-node`);
            node.classList.remove('active', 'selectable', 'all-in');
            node.style.opacity = "0.3";
            
            if (p.chips > 0) {
                let actualAnte = Math.min(p.chips, ANTE_AMOUNT);
                p.chips -= actualAnte;
                p.totalBet = actualAnte;
                pot += actualAnte;
                if(p.chips === 0) p.allIn = true;
            }
        });

        UI.next.style.display = 'none';
        UI.group.style.display = 'grid';
        UI.group.style.opacity = '1';
        updateUI(0);
    }

    function nextPhase() {
        phase++; actCount = 0; callVal = 0;
        players.forEach(p => p.bet = 0);
        let startIdx = firstPlayer;
        while (players[startIdx].folded || players[startIdx].allIn) {
            startIdx = (startIdx + 1) % 3;
        }
        turn = startIdx;
        UI.group.style.display = 'grid';
        setTimeout(() => UI.group.style.opacity = '1', 10);
        UI.next.style.display = 'none';
        updateUI(pot);
    }

    resetGame();
</script>
</body>
</html>

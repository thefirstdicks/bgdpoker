<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BGD POKER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@300;600;900&display=swap');

        :root { 
            --gold-gradient: linear-gradient(145deg, #f9e498 0%, #d4af37 45%, #a67c00 100%);
            --dark-surface: linear-gradient(145deg, #1a1a1a, #0a0a0a);
            --neon-gold: rgba(212, 175, 55, 0.4);
            --die-red: #ff4d4d;
        }

        body { 
            background: #050505; color: #fff; 
            font-family: 'Montserrat', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh;
            display: flex; justify-content: center;
        }

        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
            z-index: -1;
        }

        .table-layout { 
            width: 100%; max-width: 600px; height: 100vh;
            display: flex; flex-direction: column; padding: 40px 20px; box-sizing: border-box;
        }

        .pot-area { text-align: center; margin-bottom: 40px; }
        .pot-label { 
            font-size: 10px; letter-spacing: 6px; color: #666; font-weight: 900;
            text-transform: uppercase; margin-bottom: 10px;
        }
        .pot-value { 
            font-family: 'Montserrat', sans-serif; font-size: 90px; font-weight: 900; 
            letter-spacing: -2px; color: #fff; line-height: 1;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .players-area { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            flex: 1; margin-bottom: 50px;
        }
        .player-node {
            width: 30%; transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            display: flex; flex-direction: column; align-items: center; opacity: 0.3;
        }
        .player-node.active { opacity: 1; transform: translateY(-15px); }
        
        .avatar-circle {
            width: 80px; height: 80px; border-radius: 50%;
            background: var(--dark-surface);
            border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: center; align-items: center;
            font-size: 35px; margin-bottom: 15px; position: relative;
        }
        .player-node.active .avatar-circle {
            border: 2px solid #d4af37;
            box-shadow: 0 0 30px var(--neon-gold);
        }
        .turn-indicator {
            position: absolute; bottom: -5px; width: 10px; height: 10px;
            background: #d4af37; border-radius: 50%; display: none;
            box-shadow: 0 0 15px #d4af37;
        }
        .player-node.active .turn-indicator { display: block; }

        /* 칩 이모지와 텍스트 정렬 */
        .player-money { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        .player-name { font-size: 9px; color: #555; font-weight: 600; letter-spacing: 2px; }

        .controls-area { position: relative; width: 100%; height: 205px; }
        .button-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        button {
            height: 95px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
            background: #0f0f0f; color: rgba(255,255,255,0.8);
            font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 900;
            cursor: pointer; position: relative; overflow: hidden;
            transition: all 0.2s ease;
        }
        button::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        
        button:active { transform: scale(0.97); background: #151515; }
        button:disabled { opacity: 0; pointer-events: none; }

        .btn-check { color: #fff; }
        .btn-call { color: #fff; }
        .btn-half { 
            background: var(--gold-gradient); color: #000; 
            border: none; box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }
        .btn-die { color: var(--die-red); border-color: rgba(255, 77, 77, 0.2); }

        button span { display: block; font-size: 11px; font-weight: 400; margin-top: 6px; opacity: 0.5; }
        .btn-half span { color: #000; opacity: 0.7; font-weight: 600; }

        .btn-next {
            position: absolute; top: 0; left: 0; width: 100%; height: 205px;
            background: #fff; color: #000; font-size: 24px; font-weight: 900;
            border-radius: 12px; display: none; align-items: center; justify-content: center;
            letter-spacing: 4px; text-transform: uppercase; z-index: 10;
            animation: slideUp 0.4s ease-out; cursor: pointer;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(3px, 2px) rotate(-1deg); }
            60% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="bg-overlay"></div>

<div class="table-layout">
    <div class="pot-area">
        <div class="pot-label">THE POT</div>
        <div class="pot-value" id="pot-display">0</div>
    </div>

    <div class="players-area">
        <div id="p0-node" class="player-node">
            <div class="avatar-circle">🎩<div class="turn-indicator"></div></div>
            <div class="player-money">🪙<span id="p0-chips">100</span></div>
            <div class="player-name">PLAYER I</div>
        </div>
        <div id="p1-node" class="player-node">
            <div class="avatar-circle">🍷<div class="turn-indicator"></div></div>
            <div class="player-money">🪙<span id="p1-chips">100</span></div>
            <div class="player-name">PLAYER II</div>
        </div>
        <div id="p2-node" class="player-node">
            <div class="avatar-circle">🥀<div class="turn-indicator"></div></div>
            <div class="player-money">🪙<span id="p2-chips">100</span></div>
            <div class="player-name">PLAYER III</div>
        </div>
    </div>

    <div class="controls-area">
        <div class="button-grid" id="button-group">
            <button class="btn-check" id="btn-check" onclick="handleBet('check')">CHECK</button>
            <button class="btn-call" id="btn-call" onclick="handleBet('call')">CALL<span id="call-amt">0</span></button>
            <button class="btn-half" id="btn-half" onclick="handleBet('half')">HALF<span id="half-amt">0</span></button>
            <button class="btn-die" id="btn-die" onclick="handleBet('die')">FOLD</button>
        </div>
        <div class="btn-next" id="btn-next" onclick="nextPhase()">CONTINUE</div>
    </div>
</div>

<script>
    let players = [{chips: 99, bet: 0, folded: false}, {chips: 99, bet: 0, folded: false}, {chips: 99, bet: 0, folded: false}];
    let phase = 2, pot = 3, turn = 0, callVal = 0, actCount = 0;

    function animateValue(id, start, end, duration) {
        const obj = document.getElementById(id);
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }

    function updateUI(prevPot) {
        animateValue('pot-display', prevPot, pot, 1000);
        document.getElementById('call-amt').innerText = `-${callVal - players[turn].bet}`;
        document.getElementById('half-amt').innerText = `+${Math.floor(pot / 2)}`;

        players.forEach((p, i) => {
            const node = document.getElementById(`p${i}-node`);
            document.getElementById(`p${i}-chips`).innerText = p.chips;
            node.classList.toggle('active', i === turn);
            if(p.folded) node.style.opacity = "0.05";
        });

        const needCall = callVal > players[turn].bet;
        document.getElementById('btn-check').disabled = (phase === 2 && actCount === 0) || needCall;
        document.getElementById('btn-call').disabled = !needCall;
    }

    function handleBet(type) {
        let p = players[turn];
        let prevPot = pot;

        if (type === 'half') {
            document.body.style.animation = "shake 0.3s ease-in-out";
            setTimeout(() => document.body.style.animation = "", 300);
            if (navigator.vibrate) navigator.vibrate([50, 10, 50]);
            
            let diff = callVal - p.bet;
            let raise = Math.floor(pot / 2);
            p.chips -= (diff + raise); p.bet += (diff + raise); pot += (diff + raise);
            callVal = p.bet;
        } else if (type === 'call') {
            let diff = callVal - p.bet;
            p.chips -= diff; p.bet += diff; pot += diff;
        } else if (type === 'die') {
            p.folded = true;
        }
        
        actCount++;
        
        const active = players.filter(pl => !pl.folded);
        if (active.length === 1) { location.reload(); return; }

        if (active.every(pl => pl.bet === callVal) && actCount >= active.length) {
            document.getElementById('button-group').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('button-group').style.display = 'none';
                const nextBtn = document.getElementById('btn-next');
                
                if (phase >= 5) {
                    nextBtn.innerText = "NEW GAME";
                    nextBtn.onclick = () => location.reload();
                } else {
                    nextBtn.innerText = "CONTINUE";
                    nextBtn.onclick = () => nextPhase();
                }
                
                nextBtn.style.display = 'flex';
            }, 500);
        } else {
            do { turn = (turn + 1) % 3; } while (players[turn].folded);
        }
        updateUI(prevPot);
    }

    function nextPhase() {
        phase++; actCount = 0; callVal = 0;
        players.forEach(p => p.bet = 0);

        do { turn = (turn + 1) % 3; } while (players[turn].folded);
        document.getElementById('button-group').style.display = 'grid';
        setTimeout(() => document.getElementById('button-group').style.opacity = '1', 10);
        document.getElementById('btn-next').style.display = 'none';
        updateUI(pot);
    }	
    updateUI(0);
</script>
</body>
</html>
